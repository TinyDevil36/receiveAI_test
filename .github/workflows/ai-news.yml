name: AI News Push

on:
  schedule:
    # Runs every 10 min all day. GitHub Actions schedule is often delayed by
    # hours, so we no longer restrict by time window: the script pushes the
    # day's first new items then skips via dedupe for the rest of the day.
    - cron: "*/10 * * * *"

  workflow_dispatch: {}
    # Manual trigger from the Actions tab, e.g. to test a push.

jobs:
  push-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # Restore the dedupe state (rss_cache.json) from the latest saved run.
      # restore-keys matches the most recent cache whose key starts with "ai-news-".
      - name: Restore pushed-id cache
        uses: actions/cache/restore@v4
        with:
          path: rss_cache.json
          key: ai-news-cache
          restore-keys: |
            ai-news-cache-

      - name: Run AI news fetch + push
        run: python scripts/ai_news.py

      # Save the dedupe state so the next run skips already-pushed items.
      # The cache key must be unique per save (cache entries are immutable).
      - name: Save pushed-id cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: rss_cache.json
          key: ai-news-cache-${{ github.run_id }}